openapi: 3.0.3
info:
  title: Kolboo Settings Patch
  version: 1.0.0
paths:
  /settings:
    patch:
      summary: Update app settings
      description: Patch settings values used by the UI. This mirrors the existing settings_apply_patch command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                output_smart_paste_protection:
                  type: boolean
                  description: When true, smart paste protection blocks insertion into sensitive targets.
      responses:
        "200":
          description: Updated settings accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  output_smart_paste_protection:
                    type: boolean
                required:
                  - output_smart_paste_protection
