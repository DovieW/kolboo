openapi: 3.0.3
info:
  title: Kolboo OCR Service (OpenAI-compatible subset)
  version: 0.1.0
  description: |
    This contract documents the subset of an OpenAI-compatible API that Kolboo
    uses to perform OCR via a locally hosted vLLM server (e.g. LightOnOCR).

    Authentication:
    - Some providers require `Authorization: Bearer <API_KEY>`.
    - Local vLLM deployments typically do not require auth.

servers:
  - url: http://localhost:8000
  - url: https://api.openai.com

security:
  - bearerAuth: []

paths:
  /v1/models:
    get:
      summary: List available models
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                        owned_by:
                          type: string
                      required: [id]
                required: [data]

  /v1/chat/completions:
    post:
      summary: OCR via chat completion with an image payload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
      responses:
        '200':
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'

  /v1/responses:
    post:
      summary: (Optional/future) OCR via Responses API
      description: |
        Kolboo does not require this for the initial implementation, but some
        OpenAI-style providers may encourage a Responses-style endpoint.
        If implemented later, this contract can be expanded with exact request/response shapes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Response payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  schemas:
    ChatCompletionsRequest:
      type: object
      properties:
        model:
          type: string
          example: lightonai/LightOnOCR-1B-1025
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        max_tokens:
          type: integer
          minimum: 1
          example: 2048
        temperature:
          type: number
          minimum: 0
          example: 0.2
        top_p:
          type: number
          minimum: 0
          maximum: 1
          example: 0.9
      required: [model, messages]

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          description: |
            vLLM/OpenAI-compatible multimodal content. We only rely on an image payload
            plus optional instruction text.
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/TextPart'
                  - $ref: '#/components/schemas/ImageUrlPart'
      required: [role, content]

    TextPart:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
      required: [type, text]

    ImageUrlPart:
      type: object
      properties:
        type:
          type: string
          enum: [image_url]
        image_url:
          type: object
          properties:
            url:
              type: string
              description: data URL with base64-encoded PNG bytes
              example: data:image/png;base64,iVBORw0KGgoAAA...
          required: [url]
      required: [type, image_url]

    ChatCompletionsResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                    example: assistant
                  content:
                    type: string
                required: [content]
              finish_reason:
                type: string
            required: [message]
      required: [choices]
