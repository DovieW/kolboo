openapi: 3.1.0
info:
  title: Kolboo Private Admin Dashboard API
  version: 0.1.0
  summary: Phase 5 + 5A contracts for deterministic admin testing and enterprise dashboard controls.
servers:
  - url: https://api-preview.example.com
    description: PR preview
  - url: https://api.example.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: test-fixtures
  - name: members
  - name: policy
  - name: usage-audit
  - name: release
paths:
  /v1/test-fixtures/{contextKey}/seed:
    post:
      tags: [test-fixtures]
      summary: Seed deterministic non-production test personas and baseline records
      operationId: seedPreviewFixtures
      parameters:
        - $ref: '#/components/parameters/contextKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedRequest'
      responses:
        '200':
          description: Seed complete (or idempotent no-op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/test-fixtures/{contextKey}/reset:
    post:
      tags: [test-fixtures]
      summary: Reset deterministic fixtures for a preview context
      operationId: resetPreviewFixtures
      parameters:
        - $ref: '#/components/parameters/contextKey'
      responses:
        '200':
          description: Reset complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{orgId}/members:
    get:
      tags: [members]
      summary: List organization members
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Members returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [members]
      summary: Create or invite a member
      operationId: createMember
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/orgs/{orgId}/members/{memberId}:
    patch:
      tags: [members]
      summary: Update member role or status
      operationId: updateMember
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/memberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{orgId}/policy/draft:
    put:
      tags: [policy]
      summary: Save draft policy for organization
      operationId: savePolicyDraft
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyDraftRequest'
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orgs/{orgId}/policy/publish:
    post:
      tags: [policy]
      summary: Publish current draft policy
      operationId: publishPolicy
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Policy published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/orgs/{orgId}/usage-audit:
    get:
      tags: [usage-audit]
      summary: Query usage and audit records by time window and filters
      operationId: queryUsageAudit
      parameters:
        - $ref: '#/components/parameters/orgId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [usage, audit] }
        - name: actorUserId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Records returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageAuditRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/release/evidence:
    post:
      tags: [release]
      summary: Record release gate evidence (preview pass, manual approval, smoke result)
      operationId: createReleaseEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseEvidenceInput'
      responses:
        '201':
          description: Evidence stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseEvidenceRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    contextKey:
      name: contextKey
      in: path
      required: true
      description: "Preview validation context key (example: pr-123)"
      schema: { type: string }
    orgId:
      name: orgId
      in: path
      required: true
      schema: { type: string }
    memberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Concurrency or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }

    SeedRequest:
      type: object
      required: [previewId]
      properties:
        previewId: { type: string }

    SeedResponse:
      type: object
      required: [contextKey, seededOrgId, status]
      properties:
        contextKey: { type: string }
        seededOrgId: { type: string }
        status: { type: string, enum: [seeded, already-seeded] }

    ResetResponse:
      type: object
      required: [contextKey, status]
      properties:
        contextKey: { type: string }
        status: { type: string, enum: [reset, no-op] }

    Member:
      type: object
      required: [id, orgId, userId, role, status]
      properties:
        id: { type: string }
        orgId: { type: string }
        userId: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, viewer] }
        status: { type: string, enum: [active, invited, revoked] }

    CreateMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, viewer] }

    UpdateMemberRequest:
      type: object
      properties:
        role: { type: string, enum: [owner, admin, viewer] }
        status: { type: string, enum: [active, revoked] }

    PolicyDraftRequest:
      type: object
      required: [content]
      properties:
        content: { type: object, additionalProperties: true }

    PolicySnapshot:
      type: object
      required: [id, orgId, version, status, content]
      properties:
        id: { type: string }
        orgId: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published] }
        content: { type: object, additionalProperties: true }
        publishedAt: { type: string, format: date-time, nullable: true }

    UsageAuditRecord:
      type: object
      required: [id, orgId, category, action, occurredAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        category: { type: string, enum: [usage, audit] }
        actorUserId: { type: string, nullable: true }
        action: { type: string }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }

    ReleaseEvidenceInput:
      type: object
      required: [commitSha, previewRunId, smokeStatus]
      properties:
        commitSha: { type: string }
        previewRunId: { type: string }
        prodRunId: { type: string }
        manualApprovedBy: { type: string }
        manualApprovedAt: { type: string, format: date-time }
        smokeStatus: { type: string, enum: [pending, passed, failed] }
        smokeSummary: { type: string }
        rollbackReference: { type: string }

    ReleaseEvidenceRecord:
      allOf:
        - $ref: '#/components/schemas/ReleaseEvidenceInput'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
