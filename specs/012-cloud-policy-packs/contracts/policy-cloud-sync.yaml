openapi: 3.0.3
info:
  title: Kolboo Cloud Policy Sync Contract
  version: 0.1.0
  description: >-
    Contract for desktop client cloud policy retrieval and diagnostics export.
servers:
  - url: https://policy.kolboo.example
paths:
  /v1/policy/sync:
    post:
      summary: Sync policy for enrolled desktop client
      operationId: syncPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySyncRequest'
      responses:
        '200':
          description: Policy sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySyncResponse'
        '304':
          description: Client already has latest policy
        '401':
          description: Not authenticated
        '403':
          description: Authenticated but not eligible for org policy
        '422':
          description: Policy present but invalid/unverifiable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyError'
        '503':
          description: Policy service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyError'

  /v1/policy/state:
    get:
      summary: Get effective client policy state snapshot
      operationId: getPolicyState
      responses:
        '200':
          description: Current policy state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyState'

  /v1/policy/diagnostics/export:
    post:
      summary: Export redacted policy diagnostics artifact
      operationId: exportPolicyDiagnostics
      responses:
        '200':
          description: Export created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDiagnosticsExport'

components:
  schemas:
    PolicySyncRequest:
      type: object
      required: [clientId, appVersion, lastKnownVersion]
      properties:
        clientId:
          type: string
        appVersion:
          type: string
        lastKnownVersion:
          type: integer
          nullable: true
        nowUtc:
          type: string
          format: date-time

    PolicySyncResponse:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/PolicyState'
        policyPack:
          $ref: '#/components/schemas/PolicyPack'
          nullable: true

    PolicyPack:
      type: object
      required:
        - policyId
        - orgId
        - version
        - issuedAt
        - expiresAt
        - constraints
        - signature
        - keyId
      properties:
        policyId:
          type: string
        orgId:
          type: string
        version:
          type: integer
          minimum: 1
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        constraints:
          type: object
          additionalProperties: true
        defaults:
          type: object
          additionalProperties: true
        signature:
          type: string
        keyId:
          type: string

    PolicyState:
      type: object
      required: [source, eligible, enforcedCount]
      properties:
        source:
          type: string
          enum: [none, cloud, cached, degraded_expired]
        eligible:
          type: boolean
        activePolicyId:
          type: string
          nullable: true
        activeVersion:
          type: integer
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
          nullable: true
        enforcedCount:
          type: integer
          minimum: 0

    PolicyEnforcementRecord:
      type: object
      required: [settingKey, status, reason]
      properties:
        settingKey:
          type: string
        status:
          type: string
          enum: [enforced, defaulted, rejected, editable]
        effectiveValue:
          nullable: true
        reason:
          type: string
        policyVersion:
          type: integer
          nullable: true

    PolicyDiagnosticsExport:
      type: object
      required:
        - generatedAt
        - appVersion
        - policyState
        - enforcementSummary
        - enforcementRecords
      properties:
        generatedAt:
          type: string
          format: date-time
        appVersion:
          type: string
        policyState:
          $ref: '#/components/schemas/PolicyState'
        policyMetadata:
          type: object
          additionalProperties: true
        enforcementSummary:
          type: object
          additionalProperties:
            type: integer
        enforcementRecords:
          type: array
          items:
            $ref: '#/components/schemas/PolicyEnforcementRecord'

    PolicyError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
