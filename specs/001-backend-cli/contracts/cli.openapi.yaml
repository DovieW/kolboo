openapi: "3.0.3"
info:
  title: "Kolboo Backend CLI Contract"
  version: "0.1.0"
  description: "Contract-style specification for CLI commands and outputs."
servers:
  - url: "cli://local"
paths:
  /pipeline/run:
    post:
      summary: "Start a headless pipeline run"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineRunRequest"
      responses:
        "200":
          description: "Pipeline run started"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /pipeline/status:
    get:
      summary: "Get current pipeline status"
      responses:
        "200":
          description: "Current pipeline status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /settings/get:
    get:
      summary: "Get a setting value"
      parameters:
        - in: query
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Setting value"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /settings/set:
    post:
      summary: "Set a setting value"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: "Setting updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /profiles/list:
    get:
      summary: "List available profiles"
      responses:
        "200":
          description: "Profiles list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /profiles/use:
    post:
      summary: "Select an active profile"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSelect"
      responses:
        "200":
          description: "Profile selected"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /diagnostics:
    get:
      summary: "Run diagnostics"
      responses:
        "200":
          description: "Diagnostics report"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /config/export:
    get:
      summary: "Export effective configuration"
      responses:
        "200":
          description: "Configuration export"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
components:
  schemas:
    CommandResult:
      type: object
      required: [success, code]
      properties:
        success:
          type: boolean
        code:
          type: integer
        message:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties: true
          nullable: true
    PipelineRunRequest:
      type: object
      properties:
        profile_id:
          type: string
        output:
          type: string
          enum: [json, human]
    SettingUpdate:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          description: "Any JSON value"
          nullable: true
    ProfileSelect:
      type: object
      required: [profile_id]
      properties:
        profile_id:
          type: string
