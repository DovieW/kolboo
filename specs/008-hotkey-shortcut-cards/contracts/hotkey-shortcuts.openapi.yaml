openapi: 3.0.3
info:
  title: Hotkey Shortcut Cards API
  version: 1.0.0
  description: Contract for managing shortcut cards and available shortcut types.
servers:
  - url: https://local.settings
paths:
  /shortcut-types:
    get:
      summary: List available shortcut types
      responses:
        "200":
          description: Available shortcut types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShortcutType"
  /shortcut-cards:
    get:
      summary: List configured shortcut cards
      responses:
        "200":
          description: Configured shortcut cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShortcutCard"
    post:
      summary: Create a shortcut card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortcutCardCreate"
      responses:
        "201":
          description: Created shortcut card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortcutCard"
        "409":
          description: Key binding conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /shortcut-cards/{cardId}:
    patch:
      summary: Update a shortcut card
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortcutCardUpdate"
      responses:
        "200":
          description: Updated shortcut card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortcutCard"
        "409":
          description: Key binding conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a shortcut card
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
components:
  schemas:
    ShortcutType:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
          nullable: true
    ShortcutCard:
      type: object
      required: [id, type, keyBinding]
      properties:
        id:
          type: string
        type:
          type: string
          description: Shortcut type identifier.
        keyBinding:
          type: string
          nullable: true
          description: Null represents an unset shortcut.
    ShortcutCardCreate:
      type: object
      required: [type]
      properties:
        type:
          type: string
        keyBinding:
          type: string
          nullable: true
    ShortcutCardUpdate:
      type: object
      properties:
        keyBinding:
          type: string
          nullable: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
