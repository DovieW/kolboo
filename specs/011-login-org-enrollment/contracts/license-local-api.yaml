openapi: 3.1.0
info:
  title: Kolboo Local License API Contract
  version: 0.1.0
  description: |
    Logical contract for UI↔backend interactions related to login, entitlement,
    organization context, and offline grace behavior.
servers:
  - url: tauri://local
paths:
  /license/state:
    get:
      operationId: licenseGetState
      summary: Get current license/account state
      responses:
        "200":
          description: Current normalized license state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseState"
  /license/login:
    post:
      operationId: licenseStartLogin
      summary: Start login flow and persist resulting session material in secure storage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login completed and entitlement cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseState"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFacingError"
        "503":
          description: Identity provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFacingError"
  /license/logout:
    post:
      operationId: licenseLogout
      summary: Clear session material and reset to signed-out state
      responses:
        "200":
          description: Signed out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseState"
  /license/refresh:
    post:
      operationId: licenseRefreshEntitlement
      summary: Refresh entitlement and recompute grace state
      responses:
        "200":
          description: Refreshed or grace/expired evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseState"
        "503":
          description: Upstream unavailable; caller should use returned state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFacingError"
  /license/manage-url:
    get:
      operationId: licenseGetManagementUrl
      summary: Resolve subscription/account management URL for current user
      responses:
        "200":
          description: Resolved management URL
          content:
            application/json:
              schema:
                type: string
                format: uri
components:
  schemas:
    LicenseStatus:
      type: string
      enum: [signed_out, active, grace, expired]
    Tier:
      type: string
      enum: [community, personal, enterprise]
    TierLimits:
      type: object
      required: [stt_seconds_monthly, llm_tokens_monthly, requests_per_day]
      properties:
        stt_seconds_monthly:
          type: integer
          minimum: 0
        llm_tokens_monthly:
          type: integer
          minimum: 0
        requests_per_day:
          type: integer
          minimum: 0
    UsageStats:
      type: object
      required: [stt_seconds_used, llm_tokens_used, requests_today]
      properties:
        stt_seconds_used:
          type: integer
          minimum: 0
        llm_tokens_used:
          type: integer
          minimum: 0
        requests_today:
          type: integer
          minimum: 0
    OrgContext:
      type: object
      required: [org_id, org_name]
      properties:
        org_id:
          type: string
        org_name:
          type: string
    LicenseState:
      type: object
      required:
        [tier, status, cached_at, usage, limits]
      properties:
        tier:
          $ref: "#/components/schemas/Tier"
        status:
          $ref: "#/components/schemas/LicenseStatus"
        user_id:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        org:
          allOf:
            - $ref: "#/components/schemas/OrgContext"
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        cached_at:
          type: string
          format: date-time
        last_validated_at:
          type: string
          format: date-time
          nullable: true
        usage:
          $ref: "#/components/schemas/UsageStats"
        limits:
          $ref: "#/components/schemas/TierLimits"
    LoginRequest:
      type: object
      properties:
        provider_hint:
          type: string
          description: Optional provider identifier used when multiple IdPs exist.
    UserFacingError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [auth_failed, refresh_failed, network_unavailable, session_invalid]
        message:
          type: string
        retryable:
          type: boolean
          default: false
