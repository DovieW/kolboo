openapi: 3.0.3
info:
  title: Kolboo Text Insertion Contract (type_text)
  version: 0.2.0
  description: |
    Contract record for text insertion.

    For this feature, Windows reliability improvements are implemented *behind* the existing
    `type_text` Tauri command (UIA-first with paste/typing fallbacks). We are intentionally
    not adding new Windows-only invoke commands in Phase 1.

    NOTE: Kolboo uses Tauri `invoke` rather than HTTP; this OpenAPI doc is a structured
    contract record for the command payloads.

paths:
  /invoke/type_text:
    post:
      operationId: type_text
      summary: Insert text into the current focused target (Windows uses UIA-first fallback ladder)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypeTextRequest"
      responses:
        "200":
          description: OK (command returns void on success; errors surface as invoke rejection)

components:
  schemas:
    TypeTextRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
      required: [text]
