openapi: 3.1.0
info:
  title: Kolboo Auth Boundary Contract
  version: 0.1.0
  description: >
    Contract for desktop-to-edge authentication/authorization boundary.
    Identity is provided by upstream IdP tokens. Edge performs policy/entitlement
    enforcement and metering for managed operations.
  x-version-notes:
    - 0.1.0 establishes baseline auth context, managed inference authz semantics, and optional session exchange surface.
    - Non-breaking additions should use additive fields and examples while preserving existing response code semantics.
    - Breaking changes require a version bump and synchronized updates to desktop Rust/TypeScript wrappers.
servers:
  - url: https://{apiEdgeOrigin}
    variables:
      apiEdgeOrigin:
        default: kolboo-api-edge-dev.<your-workers-subdomain>.workers.dev
        description: Deployed api-edge Worker origin without protocol.
security:
  - bearerAuth: []
paths:
  /v1/auth/context:
    get:
      summary: Resolve caller auth context and entitlement snapshot
      description: >
        Returns effective identity and authorization context derived from the
        bearer token and organization policy.
      operationId: getAuthContext
      responses:
        "200":
          description: Context resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthContextResponse"
              examples:
                managedEnterprise:
                  value:
                    subject_id: user_01HZX8K9Q7C3W4L2B0N5X6Y7Z8
                    issuer: https://auth.kolboo.example
                    mode: enterprise
                    org_id: org_01HQ8Q13VYQRG7N6C0N4TWX2R1
                    authorization:
                      tier: enterprise
                      entitlements:
                        - managed_inference
                        - enterprise_policy
                      policy_status: allow
                      policy_version: 2026-04-21-enterprise-default
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              examples:
                tokenInvalid:
                  value:
                    code: token_invalid
                    reason_code: token_invalid
                    message: The access token is expired or invalid. Please sign in again.
                    retryable: true
        "403":
          description: Membership or policy denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              examples:
                membershipMissing:
                  value:
                    code: membership_missing
                    reason_code: membership_missing
                    message: No active organization membership was found for this user.
                    retryable: false
                policyDenied:
                  value:
                    code: policy_denied
                    reason_code: policy_denied
                    message: Organization policy denied this caller.
                    retryable: false
  /v1/managed/inference:
    post:
      summary: Execute managed inference operation
      description: >
        Performs authorization, policy evaluation, metering, and managed routing
        for cloud-managed inference operations.
      operationId: invokeManagedInference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedInferenceRequest"
      responses:
        "200":
          description: Managed inference response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedInferenceResponse"
              examples:
                rewriteAllowed:
                  value:
                    request_id: req_01HV73P2AN64A19T1D6M2XK0X7
                    output:
                      text: Could you please send the latest design review notes?
                    metering:
                      units: 184
                      window: daily
        "401":
          description: Re-authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              examples:
                reauthRequired:
                  value:
                    code: reauth_required
                    reason_code: reauth_required
                    message: Managed access requires a fresh desktop sign-in.
                    retryable: true
                tokenInvalid:
                  value:
                    code: token_invalid
                    reason_code: token_invalid
                    message: The bearer token could not be validated.
                    retryable: true
        "402":
          description: Entitlement/tier constraint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              examples:
                insufficientTier:
                  value:
                    code: insufficient_tier
                    reason_code: insufficient_tier
                    message: Managed inference is not included in the current plan.
                    retryable: false
        "403":
          description: Policy denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              examples:
                policyDenied:
                  value:
                    code: policy_denied
                    reason_code: policy_denied
                    message: Organization policy denied this managed operation.
                    retryable: false
                membershipMissing:
                  value:
                    code: membership_missing
                    reason_code: membership_missing
                    message: Caller is authenticated, but no eligible organization membership exists.
                    retryable: false
  /v1/session/exchange:
    post:
      summary: Exchange upstream IdP token for Kolboo session token (optional phase)
      description: >
        Optional endpoint introduced when token-exchange trigger criteria are met.
      operationId: exchangeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Exchange succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenExchangeResponse"
              examples:
                readinessPlaceholder:
                  value:
                    enabled: false
                    decision: direct_idp_token
                    trigger_set:
                      multi_idp_required: false
                      kill_switch_required: false
                      embedded_claims_required: false
                      desktop_idp_agnostic_required: false
                      reviewed_at: null
                      decision: direct_idp_token
                    session_token: null
                    refresh_token: null
                    expires_at: null
                    claims: {}
                    reason: Token exchange remains in direct_idp_token mode until one or more enterprise triggers are active.
        "401":
          description: Upstream token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              examples:
                upstreamTokenInvalid:
                  value:
                    code: token_invalid
                    reason_code: token_invalid
                    message: The upstream IdP token is invalid or expired.
                    retryable: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthContextResponse:
      type: object
      required:
        - subject_id
        - issuer
        - mode
        - authorization
      properties:
        subject_id:
          type: string
        issuer:
          type: string
        mode:
          type: string
          enum: [community, personal, enterprise]
        org_id:
          type: string
          nullable: true
        authorization:
          $ref: "#/components/schemas/AuthorizationSnapshot"
    AuthorizationSnapshot:
      type: object
      required:
        - tier
        - entitlements
        - policy_status
      properties:
        tier:
          type: string
          enum: [community, personal, enterprise]
        entitlements:
          type: array
          items:
            type: string
        policy_status:
          type: string
          enum: [allow, deny]
        policy_version:
          type: string
          nullable: true
    ManagedInferenceRequest:
      type: object
      required:
        - operation
        - payload
      properties:
        operation:
          type: string
        payload:
          type: object
          additionalProperties: true
    ManagedInferenceResponse:
      type: object
      required:
        - request_id
        - output
        - metering
      properties:
        request_id:
          type: string
        output:
          type: object
          additionalProperties: true
        metering:
          $ref: "#/components/schemas/MeteringRecord"
    MeteringRecord:
      type: object
      required:
        - units
        - window
      properties:
        units:
          type: number
        window:
          type: string
    TokenExchangeRequest:
      type: object
      required:
        - upstream_access_token
      properties:
        upstream_access_token:
          type: string
          description: Upstream IdP JWT bearer token
    TokenExchangeResponse:
      type: object
      required:
        - enabled
        - decision
        - trigger_set
        - reason
      properties:
        enabled:
          type: boolean
        decision:
          $ref: "#/components/schemas/TokenExchangeDecision"
        trigger_set:
          $ref: "#/components/schemas/TokenExchangeTriggerSet"
        session_token:
          type: string
          nullable: true
        refresh_token:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        claims:
          type: object
          additionalProperties: true
        reason:
          type: string
    TokenExchangeDecision:
      type: string
      enum: [direct_idp_token, adopt_token_exchange]
    TokenExchangeTriggerSet:
      type: object
      required:
        - multi_idp_required
        - kill_switch_required
        - embedded_claims_required
        - desktop_idp_agnostic_required
        - decision
      properties:
        multi_idp_required:
          type: boolean
        kill_switch_required:
          type: boolean
        embedded_claims_required:
          type: boolean
        desktop_idp_agnostic_required:
          type: boolean
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        decision:
          $ref: "#/components/schemas/TokenExchangeDecision"
    AuthError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - reauth_required
            - token_invalid
            - membership_missing
            - insufficient_tier
            - policy_denied
            - auth_not_configured
          description: Stable denial code. For MVP auth failures, this matches `reason_code`.
        reason_code:
          type: string
          nullable: true
          enum:
            - reauth_required
            - token_invalid
            - membership_missing
            - insufficient_tier
            - policy_denied
            - auth_not_configured
        message:
          type: string
        retryable:
          type: boolean
          default: false
