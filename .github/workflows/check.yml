name: Check

on:
  pull_request:
    branches:
      - master
  schedule:
    # Nightly (06:00 UTC). Adjust if you want a different time.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ts:
              - 'app/src/**'
              - 'app/public/**'
              - 'app/index.html'
              - 'app/vite.config.ts'
              - 'app/tsconfig.json'
              - 'app/biome.json'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/check.yml'

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read pnpm version (from app/package.json)
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version=$(node -p "require('./app/package.json').packageManager.split('@')[1]")
          echo "pnpm_version=${pnpm_version}" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm (Corepack)
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@${{ steps.pnpm-version.outputs.pnpm_version }} --activate
          pnpm -v

      - name: Get pnpm store directory
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        id: pnpm-store
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint (CI)
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm lint:ci

      - name: Typecheck
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm typecheck

      - name: Knip
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm knip

      - name: Unit tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm test

      - name: Skip TS checks (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.ts != 'true'
        run: echo "No TS/JS-related files changed; skipping TS checks."

  check:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'app/src-tauri/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/check.yml'

      - name: Install Linux system dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libasound2-dev pkg-config libgtk-3-dev

      - name: Setup Rust
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache sccache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            # Match our CI target dir usage so clippy/tests are cached consistently.
            app/src-tauri -> target-ci

      - name: Verify Rust formatting
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: Run Rust clippy (CI flags)
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SCCACHE_NO_DAEMON="1"
          export RUSTC_WRAPPER=sccache
          sccache --show-stats || true
          cargo clippy --all-targets --manifest-path app/src-tauri/Cargo.toml --target-dir app/src-tauri/target-ci
          sccache --show-stats || true

      - name: Skip Rust/Tauri checks (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.rust != 'true'
        run: echo "No Rust/Tauri-related files changed; skipping Rust checks."
