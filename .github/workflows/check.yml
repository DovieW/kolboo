name: Check

on:
  pull_request:
    branches:
      - master
  schedule:
    # Nightly (06:00 UTC). Adjust if you want a different time.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'app/src-tauri/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/check.yml'

      - name: Install Linux system dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libasound2-dev pkg-config libgtk-3-dev

      - name: Setup Rust
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache sccache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            # Match our CI target dir usage so clippy/tests are cached consistently.
            app/src-tauri -> target-ci

      - name: Verify Rust formatting
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: Run Rust clippy (CI flags)
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SCCACHE_NO_DAEMON="1"
          export RUSTC_WRAPPER=sccache
          sccache --show-stats || true
          cargo clippy --all-targets --manifest-path app/src-tauri/Cargo.toml --target-dir app/src-tauri/target-ci
          sccache --show-stats || true

      - name: Skip Rust/Tauri checks (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.rust != 'true'
        run: echo "No Rust/Tauri-related files changed; skipping Rust checks."
