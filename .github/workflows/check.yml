name: Check

on:
  pull_request:
    branches:
      - master
  schedule:
    # Nightly (06:00 UTC). Adjust if you want a different time.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable project pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./app/package.json').packageManager")" --activate

      - name: Audit JavaScript dependencies
        working-directory: app
        run: pnpm audit:js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        working-directory: app
        run: pnpm audit:rust

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable project pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./app/package.json').packageManager")" --activate

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Enforce frontend coverage
        working-directory: app
        run: pnpm coverage

  check-ts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            ts:
              - 'app/src/**'
              - 'app/public/**'
              - 'app/index.html'
              - 'app/vite.config.ts'
              - 'app/tsconfig.json'
              - 'app/biome.json'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/check.yml'

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Read pnpm version (from app/package.json)
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version=$(node -p "require('./app/package.json').packageManager.split('@')[1]")
          echo "pnpm_version=${pnpm_version}" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm (Corepack)
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@${{ steps.pnpm-version.outputs.pnpm_version }} --activate
          pnpm -v

      - name: Get pnpm store directory
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        id: pnpm-store
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint (CI)
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm lint:ci

      - name: Typecheck
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm typecheck

      - name: Knip
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm knip

      - name: Unit tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.ts == 'true'
        working-directory: app
        run: pnpm test

      - name: Skip TS checks (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.ts != 'true'
        run: echo "No TS/JS-related files changed; skipping TS checks."

  check:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            rust:
              - 'app/src-tauri/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/check.yml'

      - name: Install Linux system dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libasound2-dev pkg-config libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev

      - name: Setup Rust
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Cache sccache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Match our CI target dir usage so dead-code/clippy/tests are cached consistently.
          workspaces: |
            app/src-tauri -> target-ci

      - name: Install cargo-machete
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: cargo install cargo-machete --locked --version 0.9.2

      - name: Run Rust dead dependency check
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The repo root is not itself a Cargo project, so point cargo-machete at
          # the Tauri backend workspace explicitly.
          cargo machete app/src-tauri

      - name: Verify Rust formatting
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: Record strict dead-code ownership
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        run: echo "Strict dead-code denial runs in Windows check:ci; Ubuntu cannot assess Windows-only UIA and modifier-shortcut reachability."

      - name: Run Rust clippy (CI flags)
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER=sccache
          sccache --show-stats || true
          cargo clippy --all-targets --manifest-path app/src-tauri/Cargo.toml --target-dir app/src-tauri/target-ci
          sccache --show-stats || true

      - name: Generate contract schemas for Rust tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER=sccache
          cargo run --locked -p xtask --manifest-path app/src-tauri/Cargo.toml --target-dir app/src-tauri/target-ci -- schemas

      - name: Run Rust tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER=sccache
          # Run library tests only; schema-export bins require special build setup.
          cargo test --quiet --lib --manifest-path app/src-tauri/Cargo.toml --target-dir app/src-tauri/target-ci

      - name: Skip Rust/Tauri checks (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.rust != 'true'
        run: echo "No Rust/Tauri-related files changed; skipping Rust checks."
