name: Check

on:
  pull_request:
    branches:
      - master
  schedule:
    # Nightly (06:00 UTC). Adjust if you want a different time.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libasound2-dev pkg-config

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read pnpm version (from app/package.json)
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version=$(node -p "require('./app/package.json').packageManager.split('@')[1]")
          echo "pnpm_version=${pnpm_version}" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm (Corepack)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@${{ steps.pnpm-version.outputs.pnpm_version }} --activate
          pnpm -v

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            # Match our CI target dir usage so clippy/tests are cached consistently.
            app/src-tauri -> target-ci

      - name: Run Rust clippy (CI flags)
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          export SCCACHE_NO_DAEMON="1"
          export RUSTC_WRAPPER=sccache
          pnpm cargo:clippy:ci

      - name: Verify Rust formatting
        working-directory: app
        run: pnpm cargo:fmt:check
