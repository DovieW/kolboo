name: Ralph (Copilot CLI)

on:
  workflow_dispatch:
    inputs:
      ralph_project:
        description: "Ralph project name under .ralph/projects/<project> (example: add_tests)"
        required: true

jobs:
  run-ralph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (Kolboo backpressure)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (Kolboo backpressure)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust (Kolboo backpressure)
        uses: dtolnay/rust-toolchain@stable

      - name: Create Ralph branch
        id: branch
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $project = "${{ inputs.ralph_project }}"
          $branch = "ralph/{0}/{1}" -f $project, "${{ github.run_id }}"

          git config user.name "ralph-bot"
          git config user.email "ralph-bot@users.noreply.github.com"

          git switch -c $branch
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Seed PR commit (pre-Ralph)
        id: seed
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          # GitHub won't create a PR if there are "no commits between" base and head.
          # Create an allow-empty commit so the PR can exist immediately.
          git commit --allow-empty -m "ralph: init"

      - name: Push branch (pre-Ralph)
        id: prepush
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $branch = "${{ steps.branch.outputs.branch }}"
          git push --set-upstream origin $branch

      - name: Create PR (pre-Ralph)
        id: pr
        env:
          # Use a repo-scoped token for repo operations (PRs/branches).
          # Do NOT use COPILOT_TOKEN here: it's typically a fine-grained PAT for Copilot Requests,
          # and may not have access to the repo, causing gh PR operations to fail.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $project = "${{ inputs.ralph_project }}"
          $branch = "${{ steps.branch.outputs.branch }}"
          $repo = "${{ github.repository }}"

          # If a PR already exists for this head branch, reuse it.
          $existingNumber = ""
          try {
            $existingNumber = (gh pr list -R $repo --head $branch --json number --jq ".[0].number" 2>$null)
            if ($LASTEXITCODE -ne 0) {
              $existingNumber = ""
              $global:LASTEXITCODE = 0
            }
          } catch {
            $existingNumber = ""
          }

          if ($existingNumber) {
            Write-Host "PR already exists for '$branch': #$existingNumber" -ForegroundColor DarkGray
            "number=$existingNumber" >> $env:GITHUB_OUTPUT
            "created=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $number = ""
          $url = ""
          $url = gh pr create -R $repo --base master --head $branch --title "Ralph: $project" --body "Automated Ralph run for project '$project'."

          if ($LASTEXITCODE -ne 0 -or -not $url) {
            throw "PR create failed (gh exit=$LASTEXITCODE)."
          }

          if ($url) {
            Write-Host "Created PR: $url" -ForegroundColor Green
          }

          try {
            $number = (gh pr view -R $repo --json number --jq ".number" 2>$null)
            if ($LASTEXITCODE -ne 0) {
              $number = ""
              $global:LASTEXITCODE = 0
            }
          } catch {
            $number = ""
          }

          if ($number) {
            "number=$number" >> $env:GITHUB_OUTPUT
            "created=true" >> $env:GITHUB_OUTPUT
          } else {
            "created=false" >> $env:GITHUB_OUTPUT
          }

      - name: Run Ralph (project tickets)
        uses: DovieW/ralph-copilot-action@master
        with:
          ralph_project: ${{ inputs.ralph_project }}
          gh_token: ${{ secrets.COPILOT_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: Push branch (post-Ralph)
        id: push
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $branch = "${{ steps.branch.outputs.branch }}"

          # If we didn't create any new commits, avoid pushing.
          $ahead = 0
          try {
            $ahead = [int](git rev-list --count origin/$branch..HEAD)
          } catch {
            $ahead = 0
          }

          if ($ahead -le 0) {
            Write-Host "No new commits were created; skipping push." -ForegroundColor DarkGray
            "pushed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git push
          "pushed=true" >> $env:GITHUB_OUTPUT

      - name: Upload Ralph state
        if: always()
        id: upload_state
        uses: actions/upload-artifact@v4
        with:
          name: ralph-state
          path: .ralph/projects/${{ inputs.ralph_project }}/state

      - name: Comment PR with artifact download link
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $repo = "${{ github.repository }}"
          $prNumber = "${{ steps.pr.outputs.number }}"
          $artifactUrl = "${{ steps.upload_state.outputs.artifact-url }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if (-not $artifactUrl) {
            $artifactUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          }

          $body = @"
          Ralph run artifacts are ready.

          - **Artifact**: $artifactUrl
          - **Workflow run**: $runUrl

          (You must be logged in with repo access to download.)
          "@

          gh pr comment -R $repo $prNumber --body $body

      - name: Cleanup PR (no commits)
        if: always()
        env:
          # Same rationale as PR creation: use a repo-scoped token.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $branch = "${{ steps.branch.outputs.branch }}"
          $prNumber = "${{ steps.pr.outputs.number }}"
          $repo = "${{ github.repository }}"

          # If no *file changes* exist relative to base, close PR and delete branch.
          # (The branch always has an allow-empty seed commit so the PR can exist.)
          $changedFiles = @()
          try {
            $changedFiles = @(git diff --name-only origin/master...HEAD)
          } catch {
            $changedFiles = @()
          }

          if ($changedFiles.Count -gt 0) {
            Write-Host "File changes exist relative to origin/master; keeping PR/branch." -ForegroundColor DarkGray
            exit 0
          }

          if (-not $prNumber) {
            try {
              $prNumber = (gh pr list -R $repo --head $branch --json number --jq ".[0].number" 2>$null)
              if ($LASTEXITCODE -ne 0) {
                $prNumber = ""
                $global:LASTEXITCODE = 0
              }
            } catch {
              $prNumber = ""
            }
          }

          if ($prNumber) {
            Write-Host "No commits created; closing PR #$prNumber and deleting branch '$branch'." -ForegroundColor Yellow
            gh pr close -R $repo $prNumber --delete-branch
            if ($LASTEXITCODE -ne 0) {
              Write-Host "PR close failed; continuing cleanup." -ForegroundColor Yellow
              $global:LASTEXITCODE = 0
            }
          } else {
            Write-Host "No commits created and no PR found; deleting branch '$branch' if it exists." -ForegroundColor Yellow
            try {
              gh api -R $repo -X DELETE "repos/$repo/git/refs/heads/$branch" 2>$null
              if ($LASTEXITCODE -ne 0) {
                $global:LASTEXITCODE = 0
              }
            } catch {
              # ignore
            }
          }
