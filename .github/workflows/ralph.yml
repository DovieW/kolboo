name: Ralph (Copilot CLI)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Ticket filename (resolved under .ralph/projects/add_tests/tickets) OR a tickets folder path"
        required: true

jobs:
  run-ralph:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node (Kolboo backpressure)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm (Kolboo backpressure)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (Kolboo backpressure)
        uses: dtolnay/rust-toolchain@stable

      - name: Run Ralph (one ticket)
        uses: DovieW/ralph-copilot-action@master
        with:
          project: add_tests
          target: ${{ inputs.target }}
          profile_path: .ralph/projects/add_tests/profile.json
          state_dir: .ralph/projects/add_tests/state
          gh_token: ${{ secrets.COPILOT_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: Upload Ralph state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ralph-state
          path: .ralph/projects/add_tests/state
