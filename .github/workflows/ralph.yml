name: Ralph (Copilot CLI)

on:
  workflow_dispatch:
    inputs:
      ralph_project:
        description: "Ralph project name under .ralph/projects/<project> (example: add_tests)"
        required: true

jobs:
  run-ralph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (Kolboo backpressure)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (Kolboo backpressure)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust (Kolboo backpressure)
        uses: dtolnay/rust-toolchain@stable

      - name: Create Ralph branch
        id: branch
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $project = "${{ inputs.ralph_project }}"
          $branch = "ralph/{0}/{1}" -f $project, "${{ github.run_id }}"

          git config user.name "ralph-bot"
          git config user.email "ralph-bot@users.noreply.github.com"

          git switch -c $branch
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Push branch (pre-Ralph)
        id: prepush
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $branch = "${{ steps.branch.outputs.branch }}"
          git push --set-upstream origin $branch

      - name: Create PR (pre-Ralph)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $project = "${{ inputs.ralph_project }}"
          $branch = "${{ steps.branch.outputs.branch }}"

          # If a PR already exists for this head branch, reuse it.
          $existingNumber = ""
          try {
            $existingNumber = (gh pr list --head $branch --json number --jq ".[0].number" 2>$null)
          } catch {
            $existingNumber = ""
          }

          if ($existingNumber) {
            Write-Host "PR already exists for '$branch': #$existingNumber" -ForegroundColor DarkGray
            "number=$existingNumber" >> $env:GITHUB_OUTPUT
            "created=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $url = gh pr create --base master --head $branch --title "Ralph: $project" --body "Automated Ralph run for project '$project'."
          Write-Host "Created PR: $url" -ForegroundColor Green

          $number = (gh pr view --json number --jq ".number")
          "number=$number" >> $env:GITHUB_OUTPUT
          "created=true" >> $env:GITHUB_OUTPUT

      - name: Run Ralph (project tickets)
        uses: DovieW/ralph-copilot-action@master
        with:
          ralph_project: ${{ inputs.ralph_project }}
          gh_token: ${{ secrets.COPILOT_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: Push branch (post-Ralph)
        id: push
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $branch = "${{ steps.branch.outputs.branch }}"

          # If we didn't create any new commits, avoid pushing.
          $ahead = 0
          try {
            $ahead = [int](git rev-list --count origin/$branch..HEAD)
          } catch {
            $ahead = 0
          }

          if ($ahead -le 0) {
            Write-Host "No new commits were created; skipping push." -ForegroundColor DarkGray
            "pushed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git push
          "pushed=true" >> $env:GITHUB_OUTPUT

      - name: Cleanup PR (no commits)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $branch = "${{ steps.branch.outputs.branch }}"
          $prNumber = "${{ steps.pr.outputs.number }}"

          # If nothing changed relative to base, close PR and delete branch.
          $aheadBase = 0
          try {
            $aheadBase = [int](git rev-list --count origin/master..HEAD)
          } catch {
            $aheadBase = 0
          }

          if ($aheadBase -gt 0) {
            Write-Host "Commits exist ($aheadBase) relative to origin/master; keeping PR/branch." -ForegroundColor DarkGray
            exit 0
          }

          if (-not $prNumber) {
            try {
              $prNumber = (gh pr list --head $branch --json number --jq ".[0].number" 2>$null)
            } catch {
              $prNumber = ""
            }
          }

          if ($prNumber) {
            Write-Host "No commits created; closing PR #$prNumber and deleting branch '$branch'." -ForegroundColor Yellow
            gh pr close $prNumber --delete-branch
          } else {
            Write-Host "No commits created and no PR found; deleting branch '$branch' if it exists." -ForegroundColor Yellow
            try {
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" 2>$null
            } catch {
              # ignore
            }
          }

      - name: Upload Ralph state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ralph-state
          path: .ralph/projects/${{ inputs.ralph_project }}/state
