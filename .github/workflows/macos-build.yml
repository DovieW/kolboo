name: Build (macOS)

on:
  workflow_call:
    inputs:
      service_enabled:
        description: "Embed public account configuration; Community builds remain the default"
        type: boolean
        default: false
      architecture:
        description: "Mac architecture to package"
        required: true
        type: string
      release_build:
        description: "Require release telemetry assets and signed automatic-update packages"
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: "Name of the uploaded macOS bundle artifact"
        value: ${{ jobs.build-macos.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      service_enabled:
        description: "Embed public account configuration"
        type: boolean
        default: false
      architecture:
        description: "Architecture for the private test artifact"
        required: true
        type: choice
        default: apple-silicon
        options:
          - apple-silicon
          - intel
          - universal

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'intel' && 'macos-15-intel' || 'macos-15' }}

    outputs:
      artifact-name: ${{ steps.package.outputs.artifact_name }}

    env:
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 1
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      # Service releases retain account-free BYOK; never embed server credentials.
      TAURI_CLOUD_ENV: ${{ inputs.service_enabled && 'production' || 'community' }}
      VITE_CLOUD_SERVICE_ENABLED: ${{ inputs.service_enabled && 'true' || 'false' }}
      TAURI_API_BASE_URL: ${{ inputs.service_enabled && vars.KOLBOO_PROD_API_BASE_URL || '' }}
      TAURI_MANAGED_INFERENCE_GATEWAY_URL: ${{ inputs.service_enabled && vars.KOLBOO_PROD_MANAGED_INFERENCE_GATEWAY_URL || '' }}
      TAURI_SUPABASE_URL: ${{ inputs.service_enabled && vars.KOLBOO_PROD_SUPABASE_URL || '' }}
      TAURI_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.service_enabled && vars.KOLBOO_PROD_SUPABASE_PUBLISHABLE_KEY || '' }}
      TAURI_PUBLIC_AUTH_PAGE_URL: ${{ inputs.service_enabled && vars.KOLBOO_PROD_PUBLIC_AUTH_PAGE_URL || '' }}
      TAURI_POSTHOG_API_KEY: ${{ vars.POSTHOG_PUBLIC_PROJECT_TOKEN }}
      TAURI_POSTHOG_HOST: ${{ vars.POSTHOG_PUBLIC_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select native build target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.architecture }}" in
            apple-silicon)
              echo "KOLBOO_BUILD_TARGET=aarch64-apple-darwin" >> "$GITHUB_ENV"
              echo "KOLBOO_ARTIFACT_SUFFIX=apple-silicon" >> "$GITHUB_ENV"
              ;;
            intel)
              echo "KOLBOO_BUILD_TARGET=x86_64-apple-darwin" >> "$GITHUB_ENV"
              echo "KOLBOO_ARTIFACT_SUFFIX=intel" >> "$GITHUB_ENV"
              ;;
            universal)
              echo "KOLBOO_BUILD_TARGET=universal-apple-darwin" >> "$GITHUB_ENV"
              echo "KOLBOO_ARTIFACT_SUFFIX=universal" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported architecture: ${{ inputs.architecture }}" >&2
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable project pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./app/package.json').packageManager")" --activate

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Compute build metadata
        id: build-meta
        shell: bash
        env:
          SENTRY_BUILD_KIND: ${{ inputs.release_build && 'release' || 'development' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PUBLIC_DEV_DSN: ${{ vars.SENTRY_PUBLIC_DEV_DSN }}
          SENTRY_PUBLIC_PROD_DSN: ${{ vars.SENTRY_PUBLIC_PROD_DSN }}
          TAURI_SENTRY_DSN: ${{ secrets.TAURI_SENTRY_DSN }}
        run: |
          set -euo pipefail
          node --test .github/scripts/configure-desktop-sentry.test.mjs .github/scripts/upload-desktop-symbols.test.mjs
          node --test .github/scripts/validate-desktop-cloud-config.test.mjs
          node .github/scripts/validate-desktop-cloud-config.mjs
          node .github/scripts/configure-desktop-sentry.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt

      - name: Verify native symbol tools
        shell: bash
        run: |
          set -euo pipefail
          xcrun --find dwarfdump

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri -> target
          shared-key: macos-${{ runner.arch }}-${{ inputs.architecture }}

      - name: Build ad-hoc-signed macOS bundles
        working-directory: app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dov-weinstock
          SENTRY_PROJECT: ${{ steps.build-meta.outputs.project }}
          SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          TAURI_SENTRY_ENV: ${{ steps.build-meta.outputs.environment }}
          TAURI_SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          VITE_SENTRY_ENV: ${{ steps.build-meta.outputs.environment }}
          VITE_SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          VITE_SIGNED_UPDATER_ENABLED: ${{ inputs.release_build && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_build && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_build && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER=sccache
          config=src-tauri/tauri.macos-development.conf.json
          if [[ "${{ inputs.release_build }}" == "true" ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            config=src-tauri/tauri.macos-release.conf.json
          fi
          pnpm tauri build \
            --target "$KOLBOO_BUILD_TARGET" \
            --config "$config"

      - name: Verify and upload native symbols
        working-directory: app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dov-weinstock
          SENTRY_PROJECT: ${{ steps.build-meta.outputs.project }}
          SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          binary="src-tauri/target/$KOLBOO_BUILD_TARGET/release/kolboo"
          test -f "$binary"
          # Cargo puts the dSYMs beside hashed binaries under release/deps,
          # not beside the top-level binaries that Tauri merges. Match each
          # architecture's actual UUID instead of assuming a filename.
          if [[ "$KOLBOO_BUILD_TARGET" == "universal-apple-darwin" ]]; then
            targets=(aarch64-apple-darwin x86_64-apple-darwin)
          else
            targets=("$KOLBOO_BUILD_TARGET")
          fi
          dwarfs=()
          for target in "${targets[@]}"; do
            release_dir="src-tauri/target/$target/release"
            arch_binary="$release_dir/kolboo"
            test -f "$arch_binary"
            expected_uuid=$(xcrun dwarfdump --uuid "$arch_binary" | awk '{ print $2 }')
            test -n "$expected_uuid"
            matching_dwarf=""
            while IFS= read -r -d '' candidate; do
              candidate_uuid=$(xcrun dwarfdump --uuid "$candidate" | awk '{ print $2 }')
              if [[ "$candidate_uuid" == "$expected_uuid" ]]; then
                matching_dwarf="$candidate"
                break
              fi
            done < <(find "$release_dir" -type f -path '*/kolboo*.dSYM/Contents/Resources/DWARF/*' -print0)
            if [[ -z "$matching_dwarf" ]]; then
              echo "No dSYM matches $target UUID $expected_uuid; available Kolboo dSYMs:" >&2
              find "$release_dir" -type d -name 'kolboo*.dSYM' -print >&2
              exit 1
            fi
            echo "Matched $target symbols: $matching_dwarf"
            dwarfs+=("$matching_dwarf")
          done
          diff -u \
            <(xcrun dwarfdump --uuid "$binary" | awk '{ print $2, $3 }' | sort) \
            <(xcrun dwarfdump --uuid "${dwarfs[@]}" | awk '{ print $2, $3 }' | sort)
          # Sentry CLI accepts each architecture-specific dSYM, but rejects
          # the two-architecture universal executable as a single DIF.
          node ../.github/scripts/upload-desktop-symbols.mjs "${dwarfs[@]}"

      - name: Locate and verify bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="app/src-tauri/target/$KOLBOO_BUILD_TARGET/release/bundle"
          app_path=$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          dmg_path=$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)

          if [[ -z "$app_path" || -z "$dmg_path" ]]; then
            echo "Expected both an application bundle and a DMG under $bundle_root" >&2
            find "$bundle_root" -maxdepth 3 -print || true
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          executable="$app_path/Contents/MacOS/kolboo"
          test -x "$executable"
          file "$executable"
          lipo -info "$executable"
          if [[ "$KOLBOO_BUILD_TARGET" == "universal-apple-darwin" ]]; then
            lipo "$executable" -verify_arch arm64 x86_64
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Package downloadable artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.bundles.outputs.app_path }}" \
            "artifacts/Kolboo-${KOLBOO_ARTIFACT_SUFFIX}.app.zip"
          cp "${{ steps.bundles.outputs.dmg_path }}" \
            "artifacts/Kolboo-${KOLBOO_ARTIFACT_SUFFIX}.dmg"
          if [[ "${{ inputs.release_build }}" == "true" ]]; then
            archive="${{ steps.bundles.outputs.app_path }}.tar.gz"
            test -s "$archive"
            test -s "$archive.sig"
            cp "$archive" "artifacts/Kolboo-${KOLBOO_ARTIFACT_SUFFIX}.app.tar.gz"
            cp "$archive.sig" "artifacts/Kolboo-${KOLBOO_ARTIFACT_SUFFIX}.app.tar.gz.sig"
          fi

          cat > artifacts/build-evidence.txt <<EOF
          architecture=${{ inputs.architecture }}
          sentry_project=${{ steps.build-meta.outputs.project }}
          sentry_environment=${{ steps.build-meta.outputs.environment }}
          sentry_release=${{ steps.build-meta.outputs.release }}
          sentry_runtime_enabled=${{ steps.build-meta.outputs.reporting_enabled }}
          sentry_native_symbols_uploaded=${SENTRY_NATIVE_SYMBOLS_UPLOADED:-false}
          build_target=${KOLBOO_BUILD_TARGET}
          signing=ad-hoc
          updater_enabled=${{ inputs.release_build && 'true' || 'false' }}
          git_ref=${GITHUB_REF}
          git_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          echo "artifact_name=kolboo-macos-${KOLBOO_ARTIFACT_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/**
