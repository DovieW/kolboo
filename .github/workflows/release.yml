name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify versions + generate notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Verify versions match (and match tag)
        run: node .github/scripts/verify-versions.mjs

      - name: Test updater manifest generation
        run: node --test .github/scripts/generate-updater-manifest.test.mjs

      - name: Generate release notes from changelog.d
        run: node .github/scripts/generate-release-notes.mjs RELEASE_NOTES.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-notes
          if-no-files-found: error
          path: RELEASE_NOTES.md

  build-windows:
    name: Build Windows bundles
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    with:
      release_signing: true
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs:
      - verify
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-notes
          path: .release

      - name: Download Windows bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build-windows.outputs.artifact-name-default }}
          path: .release/windows/default

      - name: Download Windows bundles (local-whisper)
        if: ${{ needs.build-windows.outputs.artifact-name-local-whisper != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build-windows.outputs.artifact-name-local-whisper }}
          path: .release/windows/local-whisper

      - name: Attest build provenance (Windows bundles)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: .release/windows/**

      - name: Generate signed updater manifest
        run: node .github/scripts/generate-updater-manifest.mjs .release/windows/default .release/RELEASE_NOTES.md .release/windows/default/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: .release/RELEASE_NOTES.md
          files: |
            .release/windows/**
          fail_on_unmatched_files: true
