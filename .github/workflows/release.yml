name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify versions + generate notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify versions match (and match tag)
        run: node .github/scripts/verify-versions.mjs

      - name: Verify service release configuration
        env:
          TAURI_CLOUD_ENV: production
          VITE_CLOUD_SERVICE_ENABLED: "true"
          TAURI_API_BASE_URL: ${{ vars.KOLBOO_PROD_API_BASE_URL }}
          TAURI_MANAGED_INFERENCE_GATEWAY_URL: ${{ vars.KOLBOO_PROD_MANAGED_INFERENCE_GATEWAY_URL }}
          TAURI_SUPABASE_URL: ${{ vars.KOLBOO_PROD_SUPABASE_URL }}
          TAURI_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KOLBOO_PROD_SUPABASE_PUBLISHABLE_KEY }}
          TAURI_PUBLIC_AUTH_PAGE_URL: ${{ vars.KOLBOO_PROD_PUBLIC_AUTH_PAGE_URL }}
        run: |
          node --test .github/scripts/validate-desktop-cloud-config.test.mjs .github/scripts/service-release-workflows.test.mjs
          node .github/scripts/validate-desktop-cloud-config.mjs

      - name: Require PostHog configuration for the release
        shell: bash
        env:
          POSTHOG_PUBLIC_PROJECT_TOKEN: ${{ vars.POSTHOG_PUBLIC_PROJECT_TOKEN }}
          POSTHOG_PUBLIC_HOST: ${{ vars.POSTHOG_PUBLIC_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "$POSTHOG_PUBLIC_PROJECT_TOKEN" || "$POSTHOG_PUBLIC_PROJECT_TOKEN" == "phc_xxx" ]]; then
            echo "Set the public PostHog project token as repository variable POSTHOG_PUBLIC_PROJECT_TOKEN before publishing." >&2
            exit 1
          fi
          case "$POSTHOG_PUBLIC_HOST" in
            https://us.i.posthog.com|https://us.i.posthog.com/|https://eu.i.posthog.com|https://eu.i.posthog.com/) ;;
            *)
              echo "Set POSTHOG_PUBLIC_HOST to the US or EU PostHog ingestion origin before publishing." >&2
              exit 1
              ;;
          esac

      - name: Test updater manifest generation
        run: node --test .github/scripts/generate-updater-manifest.test.mjs .github/scripts/check-appimage-libraries.test.mjs

      - name: Generate release notes from changelog.d
        run: node .github/scripts/generate-release-notes.mjs RELEASE_NOTES.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          if-no-files-found: error
          path: RELEASE_NOTES.md

  build-windows:
    name: Build Windows bundles
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    with:
      service_enabled: true
      build_local_whisper: false
      release_signing: true
    secrets: inherit

  build-macos:
    name: Build experimental macOS bundle
    needs: verify
    uses: ./.github/workflows/macos-build.yml
    with:
      service_enabled: true
      architecture: universal
      release_build: true
    secrets: inherit

  build-linux:
    name: Build Linux packages
    needs: verify
    uses: ./.github/workflows/linux-build.yml
    with:
      service_enabled: true
      release_signing: true
    secrets: inherit

  publish:
    name: Prepare draft GitHub Release
    needs:
      - verify
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .release

      - name: Download Windows bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-windows.outputs.artifact-name-default }}
          path: .release/windows/default

      - name: Download Windows bundles (local-whisper)
        if: ${{ needs.build-windows.outputs.artifact-name-local-whisper != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-windows.outputs.artifact-name-local-whisper }}
          path: .release/windows/local-whisper

      - name: Download macOS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-macos.outputs.artifact-name }}
          path: .release/macos

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-linux.outputs.artifact-name }}
          path: .release/linux

      - name: Attest build provenance (Windows bundles)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .release/windows/**

      - name: Attest build provenance (macOS bundles)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .release/macos/**

      - name: Attest build provenance (Linux packages)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .release/linux/*.deb
            .release/linux/*.AppImage

      - name: Disclose unsigned Windows publisher identity
        if: ${{ needs.build-windows.outputs.publisher-signed != 'true' }}
        shell: bash
        run: |
          cat >> .release/RELEASE_NOTES.md <<'EOF'

          > **Windows installer signing:** These installers do not have an Authenticode publisher signature, so Windows may show an Unknown publisher warning. Automatic-update packages remain signed with Kolboo's updater key.
          EOF

      - name: Disclose experimental macOS distribution
        shell: bash
        run: |
          cat >> .release/RELEASE_NOTES.md <<'EOF'

          > **macOS (experimental):** The universal Mac download is ad-hoc signed, not Apple Developer ID signed or notarized. Automatic-update archives are signed with Kolboo's updater key. macOS may block its first launch; only proceed if you trust this download. Native Mac acceptance is still pending.
          EOF

      - name: Generate signed updater manifest
        run: node .github/scripts/generate-updater-manifest.mjs .release .release/RELEASE_NOTES.md .release/windows/default/latest.json

      - name: Create draft GitHub Release for exact-package acceptance
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: .release/RELEASE_NOTES.md
          draft: true
          files: |
            .release/windows/**
            .release/macos/*.dmg
            .release/macos/*.app.zip
            .release/macos/*.app.tar.gz*
            .release/linux/**
          fail_on_unmatched_files: true
