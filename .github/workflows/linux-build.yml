name: Linux Build

on:
  pull_request:
    branches:
      - master
    paths:
      - "app/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable project pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./app/package.json').packageManager")" --activate

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Cache sccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-linux-build-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-linux-build-sccache-
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri -> target

      - name: Build native Linux binary
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          export SCCACHE_NO_DAEMON="1"
          export RUSTC_WRAPPER=sccache
          pnpm tauri build --no-bundle

      - name: Verify native binary dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -x app/src-tauri/target/release/kolboo
          ldd app/src-tauri/target/release/kolboo | tee linux-binary-dependencies.txt
          if grep -q "not found" linux-binary-dependencies.txt; then
            echo "The Linux binary has unresolved shared-library dependencies." >&2
            exit 1
          fi

      - name: Upload native Linux development binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kolboo-linux-development-binary
          path: |
            app/src-tauri/target/release/kolboo
            linux-binary-dependencies.txt
          if-no-files-found: error
          retention-days: 7
