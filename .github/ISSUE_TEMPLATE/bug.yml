name: Bug report
description: Report a reproducible Kolboo problem on supported Windows v1.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, tokens, private audio/transcripts, or security vulnerabilities. Email security@kol.software for security reports."
  - type: input
    id: version
    attributes:
      label: Kolboo version
      placeholder: 0.2.4
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include request IDs and safe metadata only; review exports before posting.
