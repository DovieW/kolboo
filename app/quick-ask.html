<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Kolboo Quick Ask answer overlay" />
		<script>
			// Keep overlay accent in sync on first paint.
			// This mirrors overlay.html so the answer overlay matches the user's accent choice.
			(() => {
				try {
					const KEY = "tv_accent_color";
					const DEFAULT = "#22c55e";
					const raw = window.localStorage ? window.localStorage.getItem(KEY) : null;

					const isValidHex = (h) => typeof h === "string" && /^#([0-9a-fA-F]{6})$/.test(h);

					const clampByte = (n) => {
						n = Math.round(Number(n) || 0);
						if (n < 0) return 0;
						if (n > 255) return 255;
						return n;
					};

					const hexToRgb = (hex) => ({
						r: parseInt(hex.slice(1, 3), 16),
						g: parseInt(hex.slice(3, 5), 16),
						b: parseInt(hex.slice(5, 7), 16),
					});

					const mix = (a, b, t) => ({
						r: a.r + (b.r - a.r) * t,
						g: a.g + (b.g - a.g) * t,
						b: a.b + (b.b - a.b) * t,
					});

					const rgbToHex = (rgb) => {
						const r = clampByte(rgb.r).toString(16).padStart(2, "0");
						const g = clampByte(rgb.g).toString(16).padStart(2, "0");
						const b = clampByte(rgb.b).toString(16).padStart(2, "0");
						return `#${r}${g}${b}`;
					};

					const normalized = isValidHex(raw) ? raw : null;
					const activeHex = normalized || DEFAULT;
					const rgb = hexToRgb(activeHex);
					const hover = rgbToHex(mix(rgb, { r: 255, g: 255, b: 255 }, 0.22));

					const style = document.documentElement.style;

					if (normalized) {
						style.setProperty("--accent-rgb", `${rgb.r} ${rgb.g} ${rgb.b}`);
						style.setProperty("--accent-primary", activeHex);
						style.setProperty("--accent-hover", hover);
					} else {
						style.removeProperty("--accent-rgb");
						style.removeProperty("--accent-primary");
						style.removeProperty("--accent-hover");
					}

					// Mantine palette override (used by some components even in overlay windows).
					style.setProperty("--mantine-color-orange-6", activeHex);
					style.setProperty("--mantine-color-orange-7", hover);
					style.setProperty("--mantine-color-orange-filled", activeHex);
					style.setProperty("--mantine-color-orange-filled-hover", hover);
				} catch {
					// ignore
				}
			})();
		</script>
		<title>Kolboo Quick Ask</title>
	</head>
	<body>
		<div id="quick-ask-fallback" style="position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px 32px; box-sizing: border-box; font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
			<div style="width: min(520px, 100%); background: rgba(10, 10, 10, 0.85); color: #fff; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); padding: 12px 14px; font-size: 13px; line-height: 1.4;">
				<strong style="display: block; margin-bottom: 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7;">Quick Ask</strong>
				Loading… If this stays blank, the app didn’t finish loading the overlay.
			</div>
		</div>
		<div id="root"></div>
		<script type="module" src="./src/quick-ask-main.tsx"></script>
	</body>
</html>
