<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Kolboo Quick Ask answer overlay" />
	<script>
		// Keep overlay accent in sync on first paint.
		// This mirrors overlay.html so the answer overlay matches the user's accent choice.
		(function () {
			try {
				var KEY = "tv_accent_color";
				var DEFAULT = "#22c55e";
				var raw = window.localStorage ? window.localStorage.getItem(KEY) : null;

				var isValidHex = function (h) {
					return typeof h === "string" && /^#([0-9a-fA-F]{6})$/.test(h);
				};

				var clampByte = function (n) {
					n = Math.round(Number(n) || 0);
					if (n < 0) return 0;
					if (n > 255) return 255;
					return n;
				};

				var hexToRgb = function (hex) {
					return {
						r: parseInt(hex.slice(1, 3), 16),
						g: parseInt(hex.slice(3, 5), 16),
						b: parseInt(hex.slice(5, 7), 16),
					};
				};

				var mix = function (a, b, t) {
					return {
						r: a.r + (b.r - a.r) * t,
						g: a.g + (b.g - a.g) * t,
						b: a.b + (b.b - a.b) * t,
					};
				};

				var rgbToHex = function (rgb) {
					var r = clampByte(rgb.r).toString(16).padStart(2, "0");
					var g = clampByte(rgb.g).toString(16).padStart(2, "0");
					var b = clampByte(rgb.b).toString(16).padStart(2, "0");
					return "#" + r + g + b;
				};

				var normalized = isValidHex(raw) ? raw : null;
				var activeHex = normalized || DEFAULT;
				var rgb = hexToRgb(activeHex);
				var hover = rgbToHex(mix(rgb, { r: 255, g: 255, b: 255 }, 0.22));

				var style = document.documentElement.style;

				if (normalized) {
					style.setProperty("--accent-rgb", rgb.r + " " + rgb.g + " " + rgb.b);
					style.setProperty("--accent-primary", activeHex);
					style.setProperty("--accent-hover", hover);
				} else {
					style.removeProperty("--accent-rgb");
					style.removeProperty("--accent-primary");
					style.removeProperty("--accent-hover");
				}

				// Mantine palette override (used by some components even in overlay windows).
				style.setProperty("--mantine-color-orange-6", activeHex);
				style.setProperty("--mantine-color-orange-7", hover);
				style.setProperty("--mantine-color-orange-filled", activeHex);
				style.setProperty(
					"--mantine-color-orange-filled-hover",
					hover
				);
			} catch (e) {
				// ignore
			}
		})();
	</script>
	<title>Kolboo Quick Ask</title>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="./src/quick-ask-main.tsx"></script>
</body>

</html>
