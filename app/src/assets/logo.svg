<svg
	version="1.1"
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 64 64"
	role="img"
	aria-label="Kolboo logo"
>
	<!--
		Kolboo mark: microphone + friendly "boo" (ghost) capsule.
		Uses ONLY `currentColor` so the logo can be tinted via CSS `color`.
	-->
	<defs>
		<!-- Punch-out eyes (transparent holes) so the mark reads on any background. -->
		<mask id="kolboo-eyes">
			<rect x="0" y="0" width="64" height="64" fill="white" />
			<circle cx="29" cy="26" r="2.2" fill="black" />
			<circle cx="35" cy="26" r="2.2" fill="black" />
		</mask>
	</defs>

	<!-- Sound ring -->
	<circle
		cx="32"
		cy="32"
		r="24"
		fill="none"
		stroke="currentColor"
		stroke-width="4"
		opacity="0.82"
	/>

	<!-- Microphone + stand -->
	<g
		fill="none"
		stroke="currentColor"
		stroke-width="4"
		stroke-linecap="round"
		stroke-linejoin="round"
	>
		<!-- Mic arms -->
		<path d="M20 30v6c0 8 6 14 12 14s12-6 12-14v-6" />
		<!-- Stem -->
		<path d="M32 50v6" />
		<!-- Base -->
		<path d="M24 56h16" />
	</g>

	<!-- Boo capsule -->
	<rect
		x="24"
		y="14"
		width="16"
		height="26"
		rx="8"
		fill="currentColor"
		mask="url(#kolboo-eyes)"
		opacity="0.95"
	/>
</svg>
