<svg
	version="1.1"
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 64 64"
	role="img"
	aria-label="Kolboo app icon"
>
	<!--
		NOTE: This file is intended for native app icon generation.
		Unlike `logo.svg` (which uses `currentColor` for UI theming), this one
		uses explicit colors so CLI rasterization doesn't default to black.
	-->
	<defs>
		<mask id="kolboo-eyes">
			<rect x="0" y="0" width="64" height="64" fill="white" />
			<circle cx="29" cy="26" r="2.2" fill="black" />
			<circle cx="35" cy="26" r="2.2" fill="black" />
		</mask>
	</defs>

	<!-- Sound ring -->
	<circle
		cx="32"
		cy="32"
		r="24"
		fill="none"
		stroke="#38BDF8"
		stroke-width="4"
		opacity="0.9"
	/>

	<!-- Microphone + stand -->
	<g
		fill="none"
		stroke="#6D28D9"
		stroke-width="4"
		stroke-linecap="round"
		stroke-linejoin="round"
	>
		<path d="M20 30v6c0 8 6 14 12 14s12-6 12-14v-6" />
		<path d="M32 50v6" />
		<path d="M24 56h16" />
	</g>

	<!-- Boo capsule -->
	<rect
		x="24"
		y="14"
		width="16"
		height="26"
		rx="8"
		fill="#6D28D9"
		mask="url(#kolboo-eyes)"
		opacity="0.98"
	/>
</svg>
