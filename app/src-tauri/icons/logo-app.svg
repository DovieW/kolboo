<svg
	version="1.1"
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 512 512"
	role="img"
	aria-label="Kolboo app logo"
>
	<!-- Simple vector logo used by some packaging flows. -->
	<defs>
		<mask id="kolboo-eyes">
			<rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
			<circle cx="232" cy="208" r="18" fill="#000000" />
			<circle cx="280" cy="208" r="18" fill="#000000" />
		</mask>
	</defs>

	<!-- White rounded square background -->
	<rect x="0" y="0" width="512" height="512" rx="80" ry="80" fill="#FFFFFF" />

	<!-- Sound ring -->
	<circle
		cx="256"
		cy="256"
		r="192"
		fill="none"
		stroke="#38BDF8"
		stroke-width="32"
		opacity="0.9"
	/>

	<!-- Microphone + stand -->
	<g
		fill="none"
		stroke="#6D28D9"
		stroke-width="32"
		stroke-linecap="round"
		stroke-linejoin="round"
	>
		<!-- Mic arms -->
		<path d="M160 240v48c0 64 48 112 96 112s96-48 96-112v-48" />
		<!-- Stem -->
		<path d="M256 400v48" />
		<!-- Base -->
		<path d="M192 448h128" />
	</g>

	<!-- Boo capsule -->
	<rect
		x="192"
		y="112"
		width="128"
		height="208"
		rx="64"
		fill="#6D28D9"
		mask="url(#kolboo-eyes)"
		opacity="0.98"
	/>
</svg>
