# Keep the normal cross-platform path on Cargo's sparse registry. A full Git index
# is substantially slower and more disk-intensive on a clean Linux checkout.
#
# On a Windows network where sparse HTTPS fails behind a corporate proxy, retry
# that command with CARGO_REGISTRIES_CRATES_IO_PROTOCOL=git rather than making the
# expensive fallback the default for every developer and CI runner.

[http]
check-revoke = false
multiplexing = false
timeout = 600

[registries.crates-io]
protocol = "sparse"

[net]
git-fetch-with-cli = true
retry = 10
