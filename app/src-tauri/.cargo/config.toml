# NOTE: This repo is commonly used behind corporate proxies / MITM TLS setups.
# On Windows (schannel), Cargo may fail with:
#   CRYPT_E_NO_REVOCATION_CHECK
# when it cannot reach certificate revocation endpoints.
#
# These settings trade some security checks for build reliability on such networks.

[http]
check-revoke = false
multiplexing = false
timeout = 600

[registries.crates-io]
# Use the git index instead of the sparse HTTP index.
# This often works better in corporate/proxied networks where HTTPS connections
# to index.crates.io are interrupted (e.g. missing close_notify).
protocol = "git"

[net]
git-fetch-with-cli = true
retry = 10
