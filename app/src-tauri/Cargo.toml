[package]
name = "kolboo"
version = "0.2.4"
description = "Customizable AI-powered voice dictation tool"
license = "AGPL-3.0"
authors = ["kstonekuan"]
edition = "2021"
default-run = "kolboo"
autobins = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "kolboo_lib"
doctest = false

[workspace]
members = ["xtask"]
resolver = "2"

[features]
default = []
# Enable local Whisper STT (requires whisper.cpp build dependencies)
local-whisper = ["dep:whisper-rs", "dep:dirs"]

# Local Whisper build variant: compile whisper.cpp with CUDA support.
#
# This enables GPU acceleration on supported systems, but requires the CUDA toolkit
# and a working C/C++ toolchain for building whisper.cpp.
local-whisper-cuda = ["local-whisper", "whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
serde_json = "1.0.145"

[dependencies]
tauri = { version = "2.9.5", features = [
    "tray-icon",
    "macos-private-api",
    "image-png",
    "devtools",
] }
tauri-utils = "2.8.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-single-instance = "2.3.1"
tauri-plugin-cli = "~2.4.1"
# IMPORTANT: Tauri CLI enforces that the JS package (@tauri-apps/plugin-dialog)
# and the Rust crate (tauri-plugin-dialog) match on major/minor. Cargo's default
# caret requirement would allow 2.5.x, which can break CI when the JS side is
# still 2.4.x.
tauri-plugin-dialog = "~2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
log = "0.4.29"
schemars = { version = "0.8.22", features = ["derive", "chrono"] }

# Structured tracing (spans + JSON logs). We keep `log` for third-party crates,
# but route it into `tracing` so spans/fields can correlate everything.
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
sentry = "0.45"

# Keyboard automation
enigo = "0.6.1"
arboard = "3.6.1"

# Async runtime
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }  # CancellationToken

# Settings and history
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }

# Audio playback
rodio = { version = "0.21.1", default-features = false, features = [
    "mp3",
    "playback",
] }

# Audio capture
cpal = "0.17"
hound = "3.5"  # WAV encoding

# Voice Activity Detection
webrtc-vad = "0.4"
rubato = "1.0"  # High-quality audio resampling
audioadapter-buffers = "2.0"  # Adapters for rubato 1.x buffer API

# Local Whisper (whisper.cpp bindings) - Optional feature
whisper-rs = { version = "0.15", optional = true }
dirs = { version = "6.0", optional = true }  # For model storage paths

# HTTP client for STT/LLM API calls
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
dotenvy = "0.15"

# Hashing (used for validating downloaded local Whisper model files)
sha2 = "0.10"

# WebSocket client (Speechmatics realtime STT)
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"

# Base64 encoding for audio data
base64 = "0.22"

# Image processing (active-window OCR capture)
image = { version = "0.25", default-features = false, features = ["png"] }

# Zip archive creation (diagnostics export)
zip = { version = "8.5.1", default-features = false, features = ["deflate"] }

# Async utilities
async-trait = "0.1"

# Lock-free queues (used to avoid allocations in realtime audio callbacks)
crossbeam-queue = "0.3"

# Error handling
thiserror = "2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.1"
open = "5.3.2"

# Windows audio control (WASAPI)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32",
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Win32_Devices",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Gdi",
    "Win32_System",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Xps",
] }
keyring = { version = "3", features = ["windows-native"] }

# macOS audio control (CoreAudio) and NSPanel for overlay
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
wiremock = "0.6"

# Compile dependencies with optimizations even in dev/test builds.
# This dramatically speeds up `cargo test` for heavy deps (windows, tauri,
# reqwest, rubato, etc.) and makes the benchmark tests ~10-20x faster.
[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "kolboo"
path = "src/main.rs"
# Avoid building the full Tauri app binary as a test harness during `cargo test`.
test = false
bench = false

[[bin]]
name = "export_request_log_schema"
path = "src/bin/export_request_log_schema.rs"
test = false
bench = false
